[project]
name = "arfbot"
version = "0.1.0"
description = "Simple telegram football game bot"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.25.0",
    "aiosqlite>=0.22.1",
    "loguru>=0.7.3",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

